<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Giveaway Fayz</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[data-theme="dark"]{--bg:#0f0f0f;--card:#1a1a1a;--border:#2e2e2e;--text:#f0f0f0;--muted:#777;--input-bg:#111;--input-border:#333;--shadow:rgba(0,0,0,0.4)}
[data-theme="light"]{--bg:#f4f4f4;--card:#fff;--border:#e0e0e0;--text:#111;--muted:#888;--input-bg:#f9f9f9;--input-border:#ccc;--shadow:rgba(0,0,0,0.08)}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;transition:background .3s,color .3s}
.theme-toggle{position:fixed;top:1.2rem;right:1.2rem;background:none;border:1px solid var(--border);border-radius:99px;padding:6px 12px;font-size:16px;cursor:pointer;color:var(--text);transition:background .2s;z-index:10}
.theme-toggle:hover{background:var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem 2rem 1.75rem;width:100%;max-width:400px;box-shadow:0 8px 32px var(--shadow)}
.card h1{font-size:1.35rem;font-weight:700;text-align:center;margin-bottom:.3rem}
.card .sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:1.75rem}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem}
.required{color:#ff5c5c;margin-left:2px}
input[type="text"]{width:100%;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:.8rem 1rem;font-size:15px;font-family:'Poppins',sans-serif;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;margin-bottom:1.25rem}
input[type="text"]::placeholder{color:#555}
input[type="text"]:focus{border-color:#6c63ff;box-shadow:0 0 0 3px rgba(108,99,255,.15)}
button[type="submit"]{width:100%;background:linear-gradient(135deg,#6c63ff,#48cfad);border:none;border-radius:10px;padding:.85rem;font-size:15px;font-weight:700;font-family:'Poppins',sans-serif;color:#fff;cursor:pointer;letter-spacing:.03em;transition:opacity .2s,transform .15s}
button[type="submit"]:hover{opacity:.88;transform:translateY(-1px)}
button[type="submit"]:active{transform:scale(.98)}
button[type="submit"]:disabled{opacity:.5;cursor:not-allowed;transform:none}
.stake-banner{display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(108,99,255,.08);border:1px solid rgba(108,99,255,.25);border-radius:10px;padding:.7rem 1rem;margin-bottom:1.25rem;font-size:13px;color:var(--muted);text-align:center;flex-wrap:wrap}
.stake-banner a{color:#6c63ff;font-weight:600;text-decoration:none}
.stake-banner a:hover{text-decoration:underline}
.note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:1.25rem;line-height:1.7}
.err-msg{font-size:12px;color:#ff5c5c;text-align:center;margin-top:.5rem;min-height:18px}
#success{display:none;text-align:center;padding:.5rem 0}
.big-emoji{font-size:3rem;display:block;margin-bottom:.75rem;animation:pop .5s cubic-bezier(.36,.07,.19,.97) both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
#success h2{font-size:1.25rem;font-weight:700;margin-bottom:.4rem;color:#6c63ff}
#success p{font-size:13px;color:var(--muted);line-height:1.7}
#success a{color:#6c63ff;font-weight:600;text-decoration:none}
footer{margin-top:2rem;font-size:11px;color:var(--muted);text-align:center}
.conf{position:fixed;width:8px;height:8px;top:-10px;border-radius:2px;pointer-events:none;z-index:999;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()">🌞</button>

<div class="card">
  <h1>🎁 Giveaway</h1>
  <p class="sub">Enter your Stake username to join the raffle!</p>

  <div id="form-wrap">
    <div class="stake-banner">
      💡 No Stake account?
      <a href="https://stake.com/?c=Fayz&offer=fayz" target="_blank" onclick="trackClick()">Create one here!</a>
    </div>

    <label for="pseudo">Stake username<span class="required">*</span></label>
    <input type="text" id="pseudo" placeholder="Your Stake username..." maxlength="40" autocomplete="off"/>

    <button type="submit" id="submit-btn" onclick="handleSubmit()">Enter Giveaway</button>
    <p class="err-msg" id="err-msg"></p>
    <p class="note">* Stake username is required.</p>
  </div>

  <div id="success">
    <span class="big-emoji">🏆</span>
    <h2>You're in!</h2>
    <p>Good luck with the draw!<br>Stay tuned for the result. 🍀<br><br>No Stake account yet?<br><a href="https://stake.com/?c=Fayz&offer=fayz" target="_blank">Create one here!</a></p>
  </div>
</div>

<footer>© Giveaway Fayz — All rights reserved</footer>

<script>
const SUPABASE_URL = 'https://sguibphaitkcchadvttp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_jBmz5JdapqDO_fEmLiViQA_uuedTEl7';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function toggleTheme(){
  const h=document.documentElement;
  h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';
  document.querySelector('.theme-toggle').textContent=h.dataset.theme==='dark'?'🌞':'🌙';
}

async function handleSubmit(){
  const pseudo=document.getElementById('pseudo').value.trim();
  const errEl=document.getElementById('err-msg');
  const btn=document.getElementById('submit-btn');
  errEl.textContent='';
  if(!pseudo){errEl.textContent='Please enter your Stake username.';return;}

  btn.disabled=true;
  btn.textContent='Sending...';

  const {error}=await sb.from('giveaway_entries').insert({pseudo});

  if(error){
    errEl.textContent='An error occurred. Please try again.';
    console.error(error);
    btn.disabled=false;
    btn.textContent='Enter Giveaway';
    return;
  }

  document.getElementById('form-wrap').style.display='none';
  document.getElementById('success').style.display='block';
  confetti();
}

async function trackClick(){
  const pseudo=document.getElementById('pseudo').value.trim()||'Unknown';
  await sb.from('stake_clicks').insert({pseudo});
}

function confetti(){
  const c=['#6c63ff','#48cfad','#FFD93D','#FF6B6B','#fff'];
  for(let i=0;i<70;i++){
    const el=document.createElement('div');
    el.className='conf';
    el.style.cssText=`left:${Math.random()*100}vw;background:${c[i%c.length]};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*0.6}s;width:${5+Math.random()*8}px;height:${5+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'}`;
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}
</script>
</body>
</html>
