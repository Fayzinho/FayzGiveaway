<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

<title>Admin — Giveaway Fayz</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[data-theme="dark"]{--bg:#0f0f0f;--card:#1a1a1a;--border:#2e2e2e;--text:#f0f0f0;--muted:#666;--input-bg:#111;--input-border:#333;--shadow:rgba(0,0,0,0.4);--row-hover:#252525}
[data-theme="light"]{--bg:#f4f4f4;--card:#fff;--border:#e0e0e0;--text:#111;--muted:#888;--input-bg:#f9f9f9;--input-border:#ccc;--shadow:rgba(0,0,0,0.08);--row-hover:#f0f0f0}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;transition:background .3s,color .3s}
.theme-toggle{position:fixed;top:1.2rem;right:1.2rem;background:none;border:1px solid var(--border);border-radius:99px;padding:6px 12px;font-size:16px;cursor:pointer;color:var(--text);z-index:10}
.theme-toggle:hover{background:var(--border)}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;width:100%;max-width:360px;box-shadow:0 8px 32px var(--shadow);text-align:center}
.lock{font-size:2.5rem;display:block;margin-bottom:1rem}
.login-card h1{font-size:1.2rem;font-weight:700;margin-bottom:.3rem}
.login-card p{font-size:13px;color:var(--muted);margin-bottom:1.5rem}
input[type="password"]{width:100%;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:.8rem 1rem;font-size:15px;font-family:'Poppins',sans-serif;color:var(--text);outline:none;transition:border-color .2s;margin-bottom:1rem;text-align:center;letter-spacing:.15em}
input[type="password"]:focus{border-color:#6c63ff;box-shadow:0 0 0 3px rgba(108,99,255,.15)}
.err{font-size:12px;color:#ff5c5c;margin-top:-.5rem;margin-bottom:.75rem;min-height:18px}
.btn{width:100%;background:linear-gradient(135deg,#6c63ff,#48cfad);border:none;border-radius:10px;padding:.8rem;font-size:15px;font-weight:700;font-family:'Poppins',sans-serif;color:#fff;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.88}
#admin-panel{display:none;width:100%;max-width:640px}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
.panel-header h1{font-size:1.3rem;font-weight:700}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.5rem 1rem;font-size:13px;text-align:center;min-width:80px}
.stat span{display:block;font-size:1.3rem;font-weight:700;color:#6c63ff}
.stat.gold span{color:#ffc800}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem}
.action-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:.45rem .9rem;font-size:12px;font-family:'Poppins',sans-serif;color:var(--text);cursor:pointer;transition:background .2s}
.action-btn:hover{background:var(--row-hover)}
.action-btn.danger{color:#ff5c5c;border-color:rgba(255,92,92,.3)}
.action-btn.danger:hover{background:rgba(255,92,92,.08)}
.search-bar{width:100%;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:.65rem 1rem;font-size:14px;font-family:'Poppins',sans-serif;color:var(--text);outline:none;margin-bottom:1rem;transition:border-color .2s}
.search-bar:focus{border-color:#6c63ff}
.entries-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 4px 16px var(--shadow);margin-bottom:2rem}
.entry-row{display:flex;align-items:center;gap:.75rem;padding:.75rem 1.1rem;border-bottom:1px solid var(--border);transition:background .15s}
.entry-row:last-child{border-bottom:none}
.entry-row:hover{background:var(--row-hover)}
