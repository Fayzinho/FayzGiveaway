<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — Giveaway Fayz</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[data-theme="dark"]{--bg:#0f0f0f;--card:#1a1a1a;--border:#2e2e2e;--text:#f0f0f0;--muted:#666;--input-bg:#111;--input-border:#333;--shadow:rgba(0,0,0,0.4);--row:#1f1f1f;--row-hover:#252525}
[data-theme="light"]{--bg:#f4f4f4;--card:#fff;--border:#e0e0e0;--text:#111;--muted:#888;--input-bg:#f9f9f9;--input-border:#ccc;--shadow:rgba(0,0,0,0.08);--row:#f9f9f9;--row-hover:#f0f0f0}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;transition:background .3s,color .3s}
.theme-toggle{position:fixed;top:1.2rem;right:1.2rem;background:none;border:1px solid var(--border);border-radius:99px;padding:6px 12px;font-size:16px;cursor:pointer;color:var(--text);z-index:10}
.theme-toggle:hover{background:var(--border)}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;width:100%;max-width:360px;box-shadow:0 8px 32px var(--shadow);text-align:center}
.lock{font-size:2.5rem;display:block;margin-bottom:1rem}
.login-card h1{font-size:1.2rem;font-weight:700;margin-bottom:.3rem}
.login-card p{font-size:13px;color:var(--muted);margin-bottom:1.5rem}
input[type="password"]{width:100%;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:.8rem 1rem;font-size:15px;font-family:'Poppins',sans-serif;color:var(--text);outline:none;transition:border-color .2s;margin-bottom:1rem;text-align:center;letter-spacing:.15em}
input[type="password"]:focus{border-color:#6c63ff;box-shadow:0 0 0 3px rgba(108,99,255,.15)}
.err{font-size:12px;color:#ff5c5c;margin-top:-.5rem;margin-bottom:.75rem;min-height:18px}
.btn{width:100%;background:linear-gradient(135deg,#6c63ff,#48cfad);border:none;border-radius:10px;padding:.8rem;font-size:15px;font-weight:700;font-family:'Poppins',sans-serif;color:#fff;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.88}
#admin-panel{display:none;width:100%;max-width:620px}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
.panel-header h1{font-size:1.3rem;font-weight:700}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.5rem 1rem;font-size:13px;text-align:center}
.stat span{display:block;font-size:1.3rem;font-weight:700;color:#6c63ff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem}
.action-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:.45rem .9rem;font-size:12px;font-family:'Poppins',sans-serif;color:var(--text);cursor:pointer;transition:background .2s}
.action-btn:hover{background:var(--row-hover)}
.action-btn.danger{color:#ff5c5c;border-color:rgba(255,92,92,.3)}
.action-btn.danger:hover{background:rgba(255,92,92,.08)}
.search-bar{width:100%;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:.65rem 1rem;font-size:14px;font-family:'Poppins',sans-serif;color:var(--text);outline:none;margin-bottom:1rem;transition:border-color .2s}
.search-bar:focus{border-color:#6c63ff}
.entries-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 4px 16px var(--shadow)}
.entry-row{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.1rem;border-bottom:1px solid var(--border);transition:background .15s}
.entry-row:last-child{border-bottom:none}
.entry-row:hover{background:var(--row-hover)}
.entry-num{font-size:11px;color:var(--muted);min-width:28px;font-weight:600}
.entry-name{font-size:14px;font-weight:600;color:var(--text);flex:1;margin:0 .75rem}
.entry-date{font-size:11px;color:var(--muted)}
.del-btn{background:none;border:none;color:#ff5c5c;font-size:18px;cursor:pointer;opacity:.4;padding:0 4px;line-height:1;transition:opacity .2s}
.del-btn:hover{opacity:1}
.empty{padding:2.5rem;text-align:center;color:var(--muted);font-size:14px}
footer{margin-top:2rem;font-size:11px;color:var(--muted);text-align:center}
</style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()">🌞</button>

<div class="login-card" id="login-view">
  <span class="lock">🔐</span>
  <h1>Admin access</h1>
  <p>Enter your password to see the giveaway entries</p>
  <input type="password" id="pw-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkPw()"/>
  <p class="err" id="pw-err"></p>
  <button class="btn" onclick="checkPw()">Login</button>
</div>

<div id="admin-panel">
  <div class="panel-header">
    <h1>🎁 Giveaway Fayz — Entries</h1>
    <div class="stats">
      <div class="stat"><span id="total-count">0</span>Entries</div>
      <div class="stat"><span id="clicks-count">0</span>Link clicks</div>
    </div>
  </div>

  <div class="actions">
    <button class="action-btn" onclick="pickWinner()">🎲 Pick a winner</button>
    <button class="action-btn" onclick="exportCSV()">📥 Export CSV</button>
    <button class="action-btn danger" onclick="clearAll()">🗑 Clear all</button>
    <button class="action-btn" onclick="logout()">← Logout</button>
  </div>

  <input class="search-bar" type="text" id="search" placeholder="Search a username..." oninput="renderEntries()"/>
  <div class="entries-card" id="entries-list"></div>

  <h2 style="font-size:1rem;font-weight:700;margin:2rem 0 .75rem;">🔗 Clicked "Create account on Stake"</h2>
  <div class="entries-card" id="clicks-list"></div>
</div>

<footer>© Giveaway Fayz — Admin panel</footer>

<script>
const SUPABASE_URL = 'https://sguibphaitkcchadvttp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_jBmz5JdapqDO_fEmLiViQA_uuedTEl7';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PASS = "fayz2024";

let allEntries = [];

function toggleTheme(){
  const h=document.documentElement;
  h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';
  document.querySelector('.theme-toggle').textContent=h.dataset.theme==='dark'?'🌞':'🌙';
}

function checkPw(){
  const val=document.getElementById('pw-input').value;
  if(val===PASS){
    document.getElementById('login-view').style.display='none';
    document.getElementById('admin-panel').style.display='block';
    loadAll();
  } else {
    document.getElementById('pw-err').textContent='Wrong password. Try again.';
    document.getElementById('pw-input').value='';
  }
}

function logout(){
  document.getElementById('login-view').style.display='';
  document.getElementById('admin-panel').style.display='none';
  document.getElementById('pw-input').value='';
  document.getElementById('pw-err').textContent='';
}

async function loadAll(){
  const {data:entries}=await sb.from('giveaway_entries').select('*').order('created_at',{ascending:true});
  const {data:clicks}=await sb.from('stake_clicks').select('*').order('created_at',{ascending:false});
  allEntries=entries||[];
  document.getElementById('total-count').textContent=allEntries.length;
  document.getElementById('clicks-count').textContent=(clicks||[]).length;
  renderEntries();
  renderClicks(clicks||[]);
}

function renderEntries(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const filtered=allEntries.filter(e=>e.pseudo.toLowerCase().includes(q));
  const list=document.getElementById('entries-list');
  if(!allEntries.length){
    list.innerHTML='<div class="empty">No entries yet. Share your giveaway link! 🚀</div>';
  } else if(!filtered.length){
    list.innerHTML='<div class="empty">No results found.</div>';
  } else {
    list.innerHTML=filtered.map((e,i)=>`
      <div class="entry-row">
        <span class="entry-num">#${allEntries.indexOf(e)+1}</span>
        <span class="entry-name">${esc(e.pseudo)}</span>
        <span class="entry-date">${new Date(e.created_at).toLocaleString('fr-FR')}</span>
        <button class="del-btn" onclick="deleteEntry('${e.id}')" title="Remove">×</button>
      </div>
    `).join('');
  }
}

function renderClicks(clicks){
  const list=document.getElementById('clicks-list');
  if(!clicks.length){
    list.innerHTML='<div class="empty">Nobody clicked the Stake link yet.</div>';
    return;
  }
  list.innerHTML=clicks.map((c,i)=>`
    <div class="entry-row">
      <span class="entry-num">#${i+1}</span>
      <span class="entry-name">${esc(c.pseudo||'Unknown')}</span>
      <span class="entry-date">${new Date(c.created_at).toLocaleString('fr-FR')}</span>
    </div>
  `).join('');
}

async function deleteEntry(id){
  if(!confirm('Remove this entry?'))return;
  await sb.from('giveaway_entries').delete().eq('id',id);
  await loadAll();
}

async function clearAll(){
  if(!confirm('Delete ALL entries? This cannot be undone.'))return;
  await sb.from('giveaway_entries').delete().neq('id','00000000-0000-0000-0000-000000000000');
  await loadAll();
}

function pickWinner(){
  if(!allEntries.length){alert('No entries yet!');return;}
  const w=allEntries[Math.floor(Math.random()*allEntries.length)];
  alert('🏆 Winner: ' + w.pseudo + '\n\nCongrats! 🎉');
}

function exportCSV(){
  if(!allEntries.length){alert('No entries to export.');return;}
  const csv='Username,Date\n'+allEntries.map(e=>`"${e.pseudo}","${new Date(e.created_at).toLocaleString('fr-FR')}"`).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='giveaway-fayz-entries.csv';
  a.click();
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
</script>
</body>
</html>
